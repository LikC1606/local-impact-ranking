[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-impact-ranking"
version = "0.1.0"
description = "Local auditable ImpactRankings-style paper influence pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
local-impact-ranking = "local_impact_ranking.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
