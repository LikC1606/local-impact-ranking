name: tests

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run publish checks
        run: scripts/check_publish_ready.sh

      - name: Run quickstart smoke
        run: scripts/run_quickstart.sh runs/quickstart

      - name: Run deliverable check
        run: scripts/run_deliverable_check.sh runs/deliverable-check
